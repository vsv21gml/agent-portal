global:
  namespace: agent-portal

web:
  replicaCount: 1
  image:
    repository: agent-portal-web
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: alb
    host: agent-portal.local
    path: /

adminWeb:
  replicaCount: 1
  image:
    repository: agent-portal-admin-web
    tag: latest
  service:
    type: ClusterIP
    port: 3100
  ingress:
    enabled: true
    className: alb
    host: admin.agent-portal.local
    path: /

api:
  replicaCount: 1
  image:
    repository: agent-portal-api
    tag: latest
  service:
    type: ClusterIP
    port: 4000
  env:
    AUTH_BYPASS: "false"
    JWT_SECRET: "change-me"
    TYPEORM_SYNC: "true"
    DATABASE_PATH: "/data/portal.sqlite"
    OIDC_AUTHORIZATION_URL: ""
    OIDC_TOKEN_URL: ""
    OIDC_USERINFO_URL: ""
    OIDC_CLIENT_ID: ""
    OIDC_CLIENT_SECRET: ""
    OIDC_REDIRECT_URI: ""
    GITLAB_BASE_URL: ""
    GITLAB_TOKEN: ""
    LITELLM_BASE_URL: ""
    LITELLM_MASTER_KEY: ""
    K8S_NOTEBOOK_ENABLED: "false"
    K8S_NOTEBOOK_NAMESPACE: "agent-notebooks"
    KUBECONFIG_PATH: ""
    NOTEBOOK_PVC: "shared-notebooks-pvc"
    NOTEBOOK_IMAGE: "jupyter/base-notebook:latest"
    NOTEBOOK_REQUEST_CPU: "1"
    NOTEBOOK_REQUEST_MEM_GI: "2"

gitlab:
  enabled: false

litellm:
  enabled: false
