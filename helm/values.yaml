global:
  namespace: agent-portal

web:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-portal-web
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: alb
    host: agent-portal.local
    path: /
  backend:
    servicePort: 4000

adminWeb:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-portal-admin-web
    tag: latest
  service:
    type: ClusterIP
    port: 3100
  ingress:
    enabled: true
    className: alb
    host: admin.agent-portal.local
    path: /
  backend:
    servicePort: 4000

api:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-portal-api
    tag: latest
  agentBuildServiceAccount:
    create: true
    name: "agent-builder"
    annotations: {}
  workspaceIngress:
    scheme: "http"
    hostTemplate: ""
    pathTemplate: "/"
    annotations: {}
  workspaceScheduling:
    nodeSelector: {}
    tolerations: []
  servingIngress:
    scheme: "http"
    hostTemplate: ""
    pathTemplate: "/"
    annotations: {}
  servingScheduling:
    nodeSelector: {}
    tolerations: []
  service:
    type: ClusterIP
    port: 4000
  env:
    AUTH_BYPASS: "false"
    INITIAL_ADMIN_EMAIL: "admin@samsung.com"
    INITIAL_ADMIN_PASSWORD: "chrlghk123#"
    JWT_SECRET: "change-me"
    TYPEORM_SYNC: "true"
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "agent_portal"
    DB_USER: "postgres"
    DB_PASSWORD: "postgres"
    DB_SSL: "false"
    OIDC_AUTHORIZATION_URL: ""
    OIDC_TOKEN_URL: ""
    OIDC_USERINFO_URL: ""
    OIDC_CLIENT_ID: ""
    OIDC_CLIENT_SECRET: ""
    OIDC_REDIRECT_URI: ""
    GITLAB_BASE_URL: ""
    GITLAB_TOKEN: ""
    LITELLM_BASE_URL: ""
    LITELLM_MASTER_KEY: ""
    OPENSEARCH_URL: ""
    OPENSEARCH_ADMIN_USERNAME: ""
    OPENSEARCH_ADMIN_PASSWORD: ""
    OPENSEARCH_INDEX_PREFIX: "project"
    KUBECONFIG_PATH: ""
    K8S_SERVING_ENABLED: "true"
    K8S_SERVING_NAMESPACE: "agent-serving"
    K8S_SERVING_INGRESS_CLASS: "nginx"
    AGENT_GIT_IMAGE: "alpine/git:2.47.2"
    AGENT_VALIDATOR_IMAGE: "node:24-alpine"
    AGENT_VALIDATOR_LLM_MODEL: "gpt-4.1-mini"
    KANIKO_EXECUTOR_IMAGE: "gcr.io/kaniko-project/executor:latest"
    AGENT_ECR_REPOSITORY: ""
    K8S_API_BASE_URL: "http://agent-portal-k8s-api:4300"
    K8S_API_INTERNAL_TOKEN: "change-me"

k8sApi:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-portal-k8s-api
    tag: latest
  service:
    type: ClusterIP
    port: 4300
  env:
    PORT: "4300"
    KUBECONFIG_PATH: ""
    K8S_API_INTERNAL_TOKEN: "change-me"
    AWS_REGION: "us-east-1"
    AWS_EKS_CLUSTER_NAME: ""
    AWS_EKS_NODE_ROLE_ARN: ""
    AWS_EKS_SUBNET_IDS: ""
    K8S_WORKSPACE_NODE_SELECTOR_JSON: "{}"
    K8S_WORKSPACE_TOLERATIONS_JSON: "[]"
    K8S_SERVING_NODE_SELECTOR_JSON: "{}"
    K8S_SERVING_TOLERATIONS_JSON: "[]"

gitlab:
  enabled: false

litellm:
  enabled: false

opensearch:
  enabled: false
