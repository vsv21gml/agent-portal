global:
  namespace: agent-portal

web:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-portal-web
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: alb
    host: agent-portal.local
    path: /
  backend:
    servicePort: 4000

adminWeb:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-portal-admin-web
    tag: latest
  service:
    type: ClusterIP
    port: 3100
  ingress:
    enabled: true
    className: alb
    host: admin.agent-portal.local
    path: /
  backend:
    servicePort: 4000

api:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-portal-api
    tag: latest
  workspaceIngress:
    scheme: "http"
    hostTemplate: ""
    pathTemplate: "/"
    annotations: {}
  service:
    type: ClusterIP
    port: 4000
  env:
    AUTH_BYPASS: "false"
    INITIAL_ADMIN_EMAIL: "admin@samsung.com"
    INITIAL_ADMIN_PASSWORD: "chrlghk123#"
    JWT_SECRET: "change-me"
    TYPEORM_SYNC: "true"
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "agent_portal"
    DB_USER: "postgres"
    DB_PASSWORD: "postgres"
    DB_SSL: "false"
    OIDC_AUTHORIZATION_URL: ""
    OIDC_TOKEN_URL: ""
    OIDC_USERINFO_URL: ""
    OIDC_CLIENT_ID: ""
    OIDC_CLIENT_SECRET: ""
    OIDC_REDIRECT_URI: ""
    GITLAB_BASE_URL: ""
    GITLAB_TOKEN: ""
    LITELLM_BASE_URL: ""
    LITELLM_MASTER_KEY: ""
    OPENSEARCH_URL: ""
    OPENSEARCH_ADMIN_USERNAME: ""
    OPENSEARCH_ADMIN_PASSWORD: ""
    OPENSEARCH_INDEX_PREFIX: "project"
    KUBECONFIG_PATH: ""

gitlab:
  enabled: false

litellm:
  enabled: false

opensearch:
  enabled: false
