apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.api.service.port }}
          env:
            - name: AUTH_BYPASS
              value: {{ .Values.api.env.AUTH_BYPASS | quote }}
            - name: JWT_SECRET
              value: {{ .Values.api.env.JWT_SECRET | quote }}
            - name: TYPEORM_SYNC
              value: {{ .Values.api.env.TYPEORM_SYNC | quote }}
            - name: DATABASE_PATH
              value: {{ .Values.api.env.DATABASE_PATH | quote }}
            - name: OIDC_AUTHORIZATION_URL
              value: {{ .Values.api.env.OIDC_AUTHORIZATION_URL | quote }}
            - name: OIDC_TOKEN_URL
              value: {{ .Values.api.env.OIDC_TOKEN_URL | quote }}
            - name: OIDC_USERINFO_URL
              value: {{ .Values.api.env.OIDC_USERINFO_URL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.api.env.OIDC_CLIENT_ID | quote }}
            - name: OIDC_CLIENT_SECRET
              value: {{ .Values.api.env.OIDC_CLIENT_SECRET | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.api.env.OIDC_REDIRECT_URI | quote }}
            - name: GITLAB_BASE_URL
              value: {{ .Values.api.env.GITLAB_BASE_URL | quote }}
            - name: GITLAB_TOKEN
              value: {{ .Values.api.env.GITLAB_TOKEN | quote }}
            - name: LITELLM_BASE_URL
              value: {{ .Values.api.env.LITELLM_BASE_URL | quote }}
            - name: LITELLM_MASTER_KEY
              value: {{ .Values.api.env.LITELLM_MASTER_KEY | quote }}
            - name: K8S_NOTEBOOK_ENABLED
              value: {{ .Values.api.env.K8S_NOTEBOOK_ENABLED | quote }}
            - name: K8S_NOTEBOOK_NAMESPACE
              value: {{ .Values.api.env.K8S_NOTEBOOK_NAMESPACE | quote }}
            - name: KUBECONFIG_PATH
              value: {{ .Values.api.env.KUBECONFIG_PATH | quote }}
            - name: NOTEBOOK_PVC
              value: {{ .Values.api.env.NOTEBOOK_PVC | quote }}
            - name: NOTEBOOK_IMAGE
              value: {{ .Values.api.env.NOTEBOOK_IMAGE | quote }}
            - name: NOTEBOOK_REQUEST_CPU
              value: {{ .Values.api.env.NOTEBOOK_REQUEST_CPU | quote }}
            - name: NOTEBOOK_REQUEST_MEM_GI
              value: {{ .Values.api.env.NOTEBOOK_REQUEST_MEM_GI | quote }}
