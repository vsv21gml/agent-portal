{{- $saName := include "api.serviceAccountName" . -}}
{{- $workspaceNs := .Values.env.K8S_WORKSPACE_NAMESPACE | default "agent-workspaces" -}}
{{- $notebookNs := .Values.env.K8S_NOTEBOOK_NAMESPACE | default "agent-notebooks" -}}
{{- if .Values.rbac.create }}
{{- if eq (.Values.env.K8S_WORKSPACE_ENABLED | default "false") "true" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $workspaceNs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api.fullname" . }}-workspace-manager
  namespace: {{ $workspaceNs }}
rules:
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "api.fullname" . }}-workspace-manager
  namespace: {{ $workspaceNs }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "api.fullname" . }}-workspace-manager
{{- end }}
{{- if eq (.Values.env.K8S_NOTEBOOK_ENABLED | default "false") "true" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $notebookNs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api.fullname" . }}-notebook-manager
  namespace: {{ $notebookNs }}
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "api.fullname" . }}-notebook-manager
  namespace: {{ $notebookNs }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "api.fullname" . }}-notebook-manager
{{- end }}
{{- end }}
