replicaCount: 1

image:
  repository: agent-portal-api
  tag: latest

service:
  type: ClusterIP
  port: 4000

env:
  AUTH_BYPASS: "false"
  JWT_SECRET: "change-me"
  TYPEORM_SYNC: "true"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "agent_portal"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  DB_SSL: "false"
  OIDC_AUTHORIZATION_URL: ""
  OIDC_TOKEN_URL: ""
  OIDC_USERINFO_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URI: ""
  GITLAB_BASE_URL: ""
  GITLAB_TOKEN: ""
  LITELLM_BASE_URL: ""
  LITELLM_MASTER_KEY: ""
  OPENSEARCH_URL: ""
  OPENSEARCH_ADMIN_USERNAME: ""
  OPENSEARCH_ADMIN_PASSWORD: ""
  OPENSEARCH_INDEX_PREFIX: "project"
  K8S_NOTEBOOK_ENABLED: "false"
  K8S_NOTEBOOK_NAMESPACE: "agent-notebooks"
  KUBECONFIG_PATH: ""
  NOTEBOOK_PVC: "shared-notebooks-pvc"
  NOTEBOOK_IMAGE: "jupyter/base-notebook:latest"
  NOTEBOOK_REQUEST_CPU: "1"
  NOTEBOOK_REQUEST_MEM_GI: "2"
