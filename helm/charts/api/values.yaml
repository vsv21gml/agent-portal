  KUBECONFIG_PATH: ""
  WORKSPACE_HOST_SUFFIX: "127.0.0.1.nip.io"
  WORKSPACE_IMAGE_NODE22: "agent-portal-vscode-node22:latest"
  WORKSPACE_IMAGE_NODE23: "agent-portal-vscode-node23:latest"
  WORKSPACE_IMAGE_NODE24: "agent-portal-vscode-node24:latest"
  WORKSPACE_IMAGE_PYTHON38: "agent-portal-vscode-python38:latest"
  AGENT_GIT_IMAGE: "alpine/git:2.47.2"
